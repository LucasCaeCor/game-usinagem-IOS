name: UsinagemConverted

options:
  bundleIdPrefix: br.com.usinagemmaster

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.17.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  UsinagemConverted:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: UsinagemConverted

    dependencies:
      - framework: ../ios-converted/composeApp/build/bin/iosArm64/debugFramework/Shared.framework
        embed: false
      - package: Firebase
        products:
          - FirebaseCore
          - FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.usinagemmaster.ios
        PRODUCT_NAME: UsinagemMaster
        EXECUTABLE_NAME: UsinagemMaster
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: UsinagemConverted/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../ios-converted/composeApp/build/bin/iosArm64/debugFramework"

schemes:
  UsinagemConverted:
    build:
      targets:
        UsinagemConverted: all
    run:
      config: Debug
    archive:
      config: Release
