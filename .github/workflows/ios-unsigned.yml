name: iOS - Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios-converted/**'
      - 'iosApp/**'
      - '.github/workflows/ios-unsigned.yml'
      - 'IOS_BUILD_CHECKLIST.md'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          # O workflow usa o Gradle instalado pela Action e NAO o wrapper da raiz.
          # O wrapper Android legado do repositorio possui checksum nao reconhecido
          # e nao deve bloquear o workspace KMP isolado em ios-converted.
          validate-wrappers: false

      - name: Show toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          java -version
          gradle --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Validate KMP project
        working-directory: ios-converted
        run: |
          set -euxo pipefail
          gradle projects --stacktrace
          gradle :composeApp:compileKotlinMetadata --stacktrace

      - name: Build Kotlin framework for physical iPhone
        working-directory: ios-converted
        run: |
          set -euxo pipefail
          gradle :composeApp:linkDebugFrameworkIosArm64 --stacktrace

          FRAMEWORK="composeApp/build/bin/iosArm64/debugFramework/Shared.framework"
          test -d "$FRAMEWORK"
          test -f "$FRAMEWORK/Shared"
          test -f "$FRAMEWORK/Headers/Shared.h"

          echo "=== Shared.framework ==="
          find "$FRAMEWORK" -maxdepth 2 -type f -print
          file "$FRAMEWORK/Shared"

          echo "=== MainViewController export check ==="
          grep -R "MainViewController" "$FRAMEWORK/Headers" >/dev/null

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          set -euxo pipefail
          rm -rf UsinagemConverted.xcodeproj
          xcodegen generate
          test -d UsinagemConverted.xcodeproj
          xcodebuild -project UsinagemConverted.xcodeproj -list

      - name: Clean previous output
        run: |
          rm -rf "$PWD/build/iphoneos" "$PWD/Payload" "$PWD/UsinagemMaster-unsigned.ipa"
          mkdir -p "$PWD/build/iphoneos"

      - name: Validate Compose iOS Info.plist
        run: |
          set -euxo pipefail
          VALUE="$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' iosApp/UsinagemConverted/Info.plist)"
          test "$VALUE" = "true"
          echo "CADisableMinimumFrameDurationOnPhone=$VALUE"

      - name: Build iOS app without signing
        run: |
          set -euxo pipefail
          xcodebuild \
            -project iosApp/UsinagemConverted.xcodeproj \
            -scheme UsinagemConverted \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build/iphoneos" \
            build

      - name: Validate generated app
        run: |
          set -euxo pipefail

          APP_PATH="$(find "$PWD/build/iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"

          test -n "$EXECUTABLE_NAME"
          test -x "$APP_PATH/$EXECUTABLE_NAME"
          test -n "$BUNDLE_ID"

          echo "APP_PATH=$APP_PATH"
          echo "EXECUTABLE_NAME=$EXECUTABLE_NAME"
          echo "BUNDLE_ID=$BUNDLE_ID"
          file "$APP_PATH/$EXECUTABLE_NAME"

          # O Shared.framework e statico: deve ser linkado ao executavel,
          # nao precisa ser embutido no bundle.
          if [ -d "$APP_PATH/Frameworks/Shared.framework" ]; then
            echo "Aviso: Shared.framework foi embutido mesmo sendo static. Removendo copia desnecessaria."
            rm -rf "$APP_PATH/Frameworks/Shared.framework"
          fi

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP_PATH="$(find "$PWD/build/iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent Payload UsinagemMaster-unsigned.ipa

          test -s UsinagemMaster-unsigned.ipa
          unzip -l UsinagemMaster-unsigned.ipa | head -100

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: UsinagemMaster-iOS-unsigned
          path: UsinagemMaster-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: |
            ios-converted/build/reports/**
            build/iphoneos/**
            iosApp/UsinagemConverted.xcodeproj/**
          if-no-files-found: ignore
          retention-days: 7
