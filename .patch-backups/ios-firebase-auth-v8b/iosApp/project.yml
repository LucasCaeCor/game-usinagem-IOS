name: UsinagemConverted

options:
  bundleIdPrefix: br.com.usinagemmaster

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"

targets:
  UsinagemConverted:
    type: application
    platform: iOS
    deploymentTarget: "14.0"

    sources:
      - path: UsinagemConverted

    dependencies:
      - framework: ../ios-converted/composeApp/build/bin/iosArm64/debugFramework/Shared.framework
        embed: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.usinagemmaster.ios
        PRODUCT_NAME: UsinagemMaster
        EXECUTABLE_NAME: UsinagemMaster
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: UsinagemConverted/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../ios-converted/composeApp/build/bin/iosArm64/debugFramework"

schemes:
  UsinagemConverted:
    build:
      targets:
        UsinagemConverted: all
    run:
      config: Debug
    archive:
      config: Release
